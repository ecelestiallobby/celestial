<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELESTIAL LOBBY | Telegram Mini App Portal</title>
    
    <!-- Sci-Fi Futuristic Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Leaflet OpenStreetMap Interactive CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-dark: #05070f;
            --panel-bg: rgba(13, 17, 33, 0.90);
            --gold-primary: #f3ce72;
            --gold-glow: #e5b842;
            --gold-dark: #8a6a1f;
            --cyan-accent: #00f0ff;
            --neon-red: #ff2a6d;
            --neon-green: #05ffa1;
            --purple-glow: #b026ff;
            --text-main: #e2e8f0;
            --text-muted: #8a99ad;
            --border-glow: rgba(243, 206, 114, 0.3);
            --font-title: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(20, 30, 60, 0.6) 0%, transparent 70%),
                radial-gradient(circle at 100% 100%, rgba(138, 106, 31, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 18px;
            line-height: 1.5;
            padding: 16px 10px;
            min-height: 100vh;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0.35;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .scifi-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(243, 206, 114, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .panel-header {
            font-family: var(--font-title);
            font-size: 1.1rem;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px dashed rgba(243, 206, 114, 0.2);
            padding-bottom: 8px;
        }

        .panel-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-header-title::before {
            content: '◈';
            color: var(--cyan-accent);
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            background: rgba(5, 7, 15, 0.85);
            border: 1px solid rgba(243, 206, 114, 0.4);
            border-radius: 8px;
            padding: 12px 14px;
            color: #fff;
            font-family: var(--font-mono);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            border-color: var(--cyan-accent);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
            color: #000;
            font-family: var(--font-title);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-block;
            text-align: center;
            width: 100%;
            box-shadow: 0 0 15px rgba(243, 206, 114, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(243, 206, 114, 0.5);
            background: linear-gradient(135deg, var(--gold-primary), #fff);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-cyan {
            background: linear-gradient(135deg, #0072ff, var(--cyan-accent));
            color: #000;
        }

        .btn-purple {
            background: linear-gradient(135deg, #6a0ded, var(--purple-glow));
            color: #fff;
        }

        .btn-red {
            background: linear-gradient(135deg, #8a1f1f, var(--neon-red));
            color: #fff;
        }

        #delivery-map {
            height: 260px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid var(--cyan-accent);
            margin-top: 10px;
            margin-bottom: 12px;
            z-index: 1;
        }

        #gateway-view {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .gateway-title {
            font-family: var(--font-title);
            font-size: 2rem;
            font-weight: 900;
            color: var(--gold-primary);
            letter-spacing: 3px;
            margin-bottom: 6px;
            text-shadow: 0 0 15px rgba(243, 206, 114, 0.5);
        }

        .gateway-subtitle {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--cyan-accent);
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .clause-box {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 16px 0;
            text-align: left;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(243, 206, 114, 0.2);
            display: flex;
            gap: 10px;
        }

        .clause-box input {
            width: auto;
            margin-top: 4px;
        }

        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: rgba(13, 17, 33, 0.8);
            border: 1px solid rgba(243, 206, 114, 0.3);
            color: var(--text-muted);
            font-family: var(--font-title);
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary));
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(243, 206, 114, 0.4);
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .menu-item.restricted {
            opacity: 0.35;
            pointer-events: none;
            filter: grayscale(1);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: rgba(243, 206, 114, 0.15);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-title);
        }

        .qty-val {
            font-family: var(--font-mono);
            width: 30px;
            text-align: center;
            font-weight: bold;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-family: var(--font-mono);
        }

        .summary-total {
            border-top: 1px solid var(--gold-primary);
            padding-top: 10px;
            margin-top: 10px;
            font-size: 1.3rem;
            color: var(--gold-primary);
            font-weight: bold;
        }

        .order-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
            font-family: var(--font-mono);
            text-align: left;
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(243, 206, 114, 0.3);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-pending { background: rgba(255, 170, 0, 0.2); border: 1px solid #ffaa00; color: #ffaa00; }
        .status-confirmed { background: rgba(0, 240, 255, 0.2); border: 1px solid var(--cyan-accent); color: var(--cyan-accent); }

        .pipeline-tracker {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            position: relative;
        }

        .pipeline-step {
            flex: 1;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .pipeline-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #222;
            border: 2px solid var(--text-muted);
            margin: 0 auto 6px auto;
            transition: all 0.3s;
        }

        .pipeline-step.active .pipeline-dot {
            background: var(--cyan-accent);
            border-color: #fff;
            box-shadow: 0 0 10px var(--cyan-accent);
        }

        .pipeline-step.completed .pipeline-dot {
            background: var(--neon-green);
            border-color: var(--neon-green);
        }

        .pipeline-label {
            font-size: 0.6rem;
            font-family: var(--font-title);
            color: var(--text-muted);
        }

        .pipeline-step.active .pipeline-label {
            color: var(--cyan-accent);
            font-weight: bold;
        }

        .ticket-card {
            background: #000;
            border: 2px dashed var(--gold-primary);
            border-radius: 12px;
            padding: 20px;
            font-family: var(--font-mono);
            text-align: left;
            margin: 20px 0;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- STARTUP SECURITY GATEWAY SCREEN -->
    <div id="gateway-view" class="scifi-panel">
        <img src="1000007102.jpg" alt="Logo" style="max-width: 160px; border-radius: 8px; margin-bottom: 16px;" onerror="this.src='1000006630.png'">
        
        <div class="gateway-title">CELESTIAL LOBBY</div>
        <div class="gateway-subtitle">TELEGRAM MINI APP GATEWAY</div>

        <div id="error-badge" style="background: rgba(255, 42, 109, 0.15); border: 1px solid var(--neon-red); color: var(--neon-red); padding: 10px; border-radius: 8px; font-family: var(--font-mono); font-size: 0.85rem; margin-bottom: 14px; display: none;"></div>

        <div style="width: 100%; max-width: 380px; text-align: left;">
            <label style="font-size: 0.85rem; color: var(--gold-primary); display: block; margin-bottom: 6px;">SELECT CLIENT TIER OR ENTER CODE:</label>
            <select id="client-select-dropdown" style="margin-bottom: 12px;" onchange="handleDropdownSelection()">
                <option value="NEW">🟢 New Client (Standard Tier)</option>
                <option value="REG">🔵 Regular Client (Full Catalog Unlocked)</option>
                <option value="ADMIN">⚡ Executive Command Station (Admin)</option>
                <option value="CUSTOM">🔑 Enter Custom 8-Digit Code</option>
            </select>

            <!-- Optional Custom Code Box (Visible only if 'Enter Custom Code' is selected) -->
            <div id="custom-code-container" style="display: none; margin-bottom: 12px;">
                <input type="text" id="gene-code-input" maxlength="8" placeholder="ENTER 8-DIGIT CODE" style="font-family: var(--font-mono); text-align: center; letter-spacing: 4px; text-transform: uppercase;">
            </div>

            <div class="clause-box">
                <input type="checkbox" id="gate-terms-agree" checked>
                <label for="gate-terms-agree">I confirm agreement and policies of Celestial Lobby before entering the order portal.</label>
            </div>

            <button class="btn" id="btn-login" onclick="attemptLogin()">ENTER PORTAL 🚀</button>
        </div>
    </div>

    <!-- ADMIN COMMAND CENTER VIEW -->
    <div id="admin-view" style="display: none;">
        <div class="scifi-panel" style="border-color: var(--cyan-accent); background: rgba(5, 20, 40, 0.95);">
            <div class="panel-header">
                <div class="panel-header-title" style="color: var(--cyan-accent);">COMMAND STATION | EXECUTIVE ACCESS</div>
                <button class="btn btn-red" style="width: 90px; padding: 6px; font-size: 0.75rem;" onclick="logout()">LOGOUT</button>
            </div>
            
            <div style="font-family: var(--font-title); font-size: 1.3rem; color: #fff; margin-bottom: 4px;">Hi, welcome to your stations!</div>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">Real-time management dashboard for customer orders, recipient dispatch details, and map pins.</p>

            <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                <div style="flex: 1; background: rgba(0,0,0,0.5); padding: 12px; border-radius: 8px; border: 1px solid var(--gold-primary);">
                    <div style="font-size: 0.75rem; color: var(--gold-primary
