<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Lobby — Portal Index</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131c2e;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border-color); background: #0f172a; }
        .logo { font-weight: bold; color: var(--accent-green); letter-spacing: 1px; }
        .nav-links { display: flex; gap: 10px; font-size: 12px; color: var(--text-muted); }
        
        /* Main Layout Sections */
        .portal-grid { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .dual-panels { display: flex; gap: 12px; }
        .square-panel { flex: 1; aspect-ratio: 1; background: #1e293b; border: 1px solid var(--border-color); border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
        .square-panel:hover { border-color: var(--accent-green); }
        .square-panel span { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
        
        .client-access-panel { background: #1e293b; border: 1px solid var(--border-color); border-radius: 6px; padding: 16px; }
        .client-access-panel h3 { font-size: 14px; margin-bottom: 12px; color: var(--accent-gold); }
        
        /* Footer */
        footer { padding: 12px 16px; border-top: 1px solid var(--border-color); background: #0f172a; display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Header -->
    <header>
        <div class="logo">[CL] CELESTIAL LOBBY</div>
        <div class="nav-links">
            <span>[HOME]</span>
            <span>[VALUES]</span>
            <span>[FAQS]</span>
        </div>
    </header>

    <!-- Main Content Grid -->
    <div class="portal-grid">
        <!-- Dual Square Panels (Celestial & Founders) -->
        <div class="dual-panels">
            <div class="square-panel">
                <strong>☁️ CELESTIAL</strong>
                <span>Catalog & Routes</span>
            </div>
            <div class="square-panel">
                <strong>🛡️ FOUNDERS</strong>
                <span>Lore & Structure</span>
            </div>
        </div>

        <!-- Client Access Portal Panel -->
        <div class="client-access-panel">
            <h3>CLIENT ACCESS PORTAL</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">Select pathway or authenticate credentials to unlock the gateway session.</p>
            <div style="display: flex; gap: 8px;">
                <button style="flex: 1; padding: 8px; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 4px; cursor: pointer;">GUEST</button>
                <button style="flex: 1; padding: 8px; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 4px; cursor: pointer;">REGULAR</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div>© CELESTIAL SYSTEM</div>
        <div class="nav-links">
            <span>[PRIVACY]</span>
            <span>[TERMS]</span>
            <span>[INFOSEC]</span>
        </div>
    </footer>
</div>

</body>
</html>
